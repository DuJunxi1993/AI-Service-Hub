name: Build macOS

on:
  push:
    branches: [macos]
    tags: ['macos-v*']
  pull_request:
    branches: [macos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-26 runner 已 GA，镜像内含 macOS 26 SDK，可编译 glassEffect /
    # glassProminent 等 macOS 26 API；且为 arm64，与本项目产物一致。
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Run unit tests
        run: swift test

      - name: Build app bundle
        run: bash build.sh

      - name: Verify bundle
        run: |
          test -d AiServiceHub.app
          test -x AiServiceHub.app/Contents/MacOS/AiServiceHub
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" AiServiceHub.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" AiServiceHub.app/Contents/Info.plist
          du -sh AiServiceHub.app

      - name: Read version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION"

      - name: Package (zip + dmg)
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ditto -c -k --keepParent AiServiceHub.app "AiServiceHub-${VERSION}-macOS.zip"
          hdiutil create \
            -volname "AI Service Hub" \
            -srcfolder AiServiceHub.app \
            -ov -format UDZO \
            "AiServiceHub-${VERSION}.dmg"
          shasum -a 256 "AiServiceHub-${VERSION}-macOS.zip" "AiServiceHub-${VERSION}.dmg" | tee release-checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiServiceHub-macOS
          path: |
            AiServiceHub-${{ steps.version.outputs.value }}-macOS.zip
            AiServiceHub-${{ steps.version.outputs.value }}.dmg
            release-checksums.txt
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AiServiceHub-${{ steps.version.outputs.value }}-macOS.zip
            AiServiceHub-${{ steps.version.outputs.value }}.dmg
            release-checksums.txt
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
